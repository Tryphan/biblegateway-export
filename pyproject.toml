[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblegateway-export"
version = "2.2.0"
description = "Export BibleGateway passages to Org, Markdown, and plain text"
readme = {file = "README.org", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
bg-export = "biblegateway_export.cli:main"

[tool.setuptools.packages.find]
include = ["biblegateway_export*"]
