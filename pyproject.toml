[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblegateway-export"
version = "2.0.0"
description = "Export BibleGateway passages to Org and Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
bg-export = "biblegateway_export.cli:main"

[tool.setuptools.packages.find]
include = ["biblegateway_export*"]
